<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownDetector - TrixNet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/Logo-TRIXNET.png" type="image/x-icon">
</head>

    <div class="main">
        <div class="corpodireito">

                <div class="voltar"><a href="index.html"> Voltar </a></div>

            </div>

            <p>Monitoramento em tempo real dos principais serviços e sistemas no Brasil.</p>
