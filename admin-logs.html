<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log de Atividades - TrixNet</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/Logo-TRIXNET.png" type="image/x-icon">
</head>
<body class="admin-panel">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img src="img/Logo-TRIXNET.png" alt="TrixNet">
                <span>Painel TrixNet</span>
            </div>
            
            <div class="sidebar-profile">
                <div class="profile-info">
                    <span>Bem-vindo,</span>
                    <h4 id="sidebar-user-name">Carregando...</h4>
                </div>
            </div>
            
            <nav class="sidebar-menu">
                <div class="menu-section">
                    <h5>Geral</h5>
                    <ul>
                        <li><a href="admin.html"><i class="fa fa-home"></i> Dashboard</a></li>
                        <li><a href="index.html"><i class="fa fa-desktop"></i> Ver Site</a></li>
                    </ul>
                </div>
                
                <div class="menu-section">
                    <h5>Conteúdo</h5>
                    <ul>
                        <li><a href="add-procedure.html"><i class="fa fa-plus-circle"></i> Novo Procedimento</a></li>
                        <li><a href="admin-procedures.html"><i class="fa fa-list"></i> Lista de Procedimentos</a></li>
                        <li><a href="admin-logs.html" class="active"><i class="fa fa-history"></i> Log de Atividades</a></li>
                    </ul>
                </div>

                <div class="menu-section">
                    <h5>Configurações</h5>
                    <ul>
                        <li><a href="admin-settings.html"><i class="fa fa-cog"></i> Configurações</a></li>
                        <li><a href="#" class="theme-toggle-trigger"><i class="fa fa-moon"></i> Alternar Tema</a></li>
                        <li><a href="#" id="sidebar-logout-btn"><i class="fa fa-sign-out-alt"></i> Sair</a></li>
                    </ul>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Nav -->
            <header class="top-nav">
                <div class="nav-left">
                    <button class="toggle-menu-btn" id="toggle-sidebar">
                        <i class="fa fa-bars"></i>
                    </button>
                    <div class="admin-search-wrapper">
                        <input type="text" id="admin-search-input" placeholder="Pesquisar atividades...">
                    </div>
                </div>
                <div class="nav-right"></div>
            </header>
            
            <!-- Content Body -->
            <div class="content-body">
                <div class="page-title" style="margin-bottom: 30px;">
                    <h2 style="color: #73879C; font-weight: 700;">Log de Atividades Completo</h2>
                </div>

                <div class="dashboard-grid">
                    <div class="dashboard-card card-lg">
                        <div class="card-header">
                            <h3>Histórico de Ações</h3>
                            <div class="card-tools">
                                <i class="fa fa-chevron-up" title="Minimizar/Maximizar"></i>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-wrapper" style="border: none;">
                                <table class="admin-table-custom">
                                    <thead>
                                        <tr>
                                            <th>Ação</th>
                                            <th>Título</th>
                                            <th>Categoria</th>
                                            <th>Data/Hora</th>
                                        </tr>
                                    </thead>
                                    <tbody id="full-logs-body">
                                        <!-- Preenchido via JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>

    <script>
        // Sidebar Toggle Logic
        document.getElementById('toggle-sidebar').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const currentMargin = window.getComputedStyle(sidebar).marginLeft;
            if (currentMargin === '0px') {
                sidebar.style.marginLeft = '-260px';
            } else {
                sidebar.style.marginLeft = '0';
            }
        });

        // Logout logic
        document.getElementById('sidebar-logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
