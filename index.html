<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Site Descontinuado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
        }

        .container {
            max-width: 900px;
            padding: 50px 30px;
        }

        .icon {
            font-size: 90px;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            opacity: 0.85;
            margin-bottom: 40px;
        }

        .divider {
            width: 120px;
            height: 4px;
            background: #00e0ff;
            margin: 0 auto 35px auto;
            border-radius: 2px;
        }

        footer {
            font-size: 0.85rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚠️</div>

        <h1>
            Devido a mudanças internas,<br>
            o site foi descontinuado
        </h1>

        <div class="divider"></div>

        <p class="subtitle">
            Agradecemos a compreensão.<br>
            Esta página não receberá novas atualizações.
        </p>

        <footer>
            © <span id="year"></span> • Todos os direitos reservados
        </footer>
    </div>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
